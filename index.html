<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Procuração — Gabriel Leme Rocha Advocacia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1f2a38;
    --ink-soft:#3d4a5c;
    --paper:#fffdf8;
    --paper-edge:#f1ece0;
    --bg:#eae4d6;
    --bg-panel:#f4f0e6;
    --oxblood:#6e2a34;
    --oxblood-dark:#57212a;
    --muted:#7a7466;
    --line:#d9d2c0;
    --line-strong:#c7bea7;
    --ok:#3d6b4f;
    --serif: Georgia, "Times New Roman", Times, "Liberation Serif", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--ink);
    color:#f4f0e6;
    padding:22px 28px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
    border-bottom:3px solid var(--oxblood);
  }
  .topbar h1{
    font-family:var(--serif);
    font-size:1.35rem;
    font-weight:700;
    margin:0;
    letter-spacing:0.01em;
  }
  .topbar .office{
    font-size:0.82rem;
    color:#c9c2b0;
  }

  /* ---------- Layout ---------- */
  .workspace{
    display:grid;
    grid-template-columns:400px 1fr;
    gap:0;
    min-height:calc(100vh - 74px);
  }
  @media (max-width:920px){
    .workspace{grid-template-columns:1fr;}
  }

  /* ---------- Form panel ---------- */
  .panel-form{
    background:var(--bg-panel);
    border-right:1px solid var(--line-strong);
    padding:26px 26px 100px;
    overflow-y:auto;
  }
  fieldset{
    border:none;
    margin:0 0 28px;
    padding:0;
  }
  legend{
    font-family:var(--serif);
    font-size:1rem;
    font-weight:700;
    color:var(--oxblood-dark);
    padding:0 0 8px;
    margin-bottom:14px;
    border-bottom:1px solid var(--line-strong);
    width:100%;
    display:block;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:0.76rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
    text-transform:none;
  }
  .field label .req{
    color:var(--oxblood);
    margin-left:2px;
  }
  .field input, .field select{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--line-strong);
    border-radius:3px;
    background:#fff;
    font-size:0.92rem;
    font-family:var(--sans);
    color:var(--ink);
  }
  .field input::placeholder{
    color:#a39d8c;
    font-style:italic;
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--oxblood);
    box-shadow:0 0 0 3px rgba(110,42,52,0.12);
  }
  .field.mono input{font-family:var(--mono); letter-spacing:0.02em;}
  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .field-row3{
    display:grid;
    grid-template-columns:1.4fr 1.6fr 1fr;
    gap:10px;
  }

  .quickfill{
    background:none;
    border:1px dashed var(--line-strong);
    color:var(--ink-soft);
    font-size:0.78rem;
    padding:7px 12px;
    border-radius:3px;
    cursor:pointer;
    margin-bottom:14px;
    width:100%;
    text-align:left;
    font-family:var(--sans);
  }
  .quickfill:hover{border-color:var(--oxblood); color:var(--oxblood-dark);}

  .actions{
    position:sticky;
    bottom:0;
    background:var(--bg-panel);
    padding-top:14px;
    margin-top:8px;
    border-top:1px solid var(--line-strong);
  }
  .btn{
    display:block;
    width:100%;
    padding:13px 16px;
    border-radius:3px;
    border:none;
    font-size:0.95rem;
    font-weight:600;
    font-family:var(--sans);
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{
    background:var(--oxblood);
    color:#fff;
    margin-bottom:9px;
  }
  .btn-primary:hover{background:var(--oxblood-dark);}
  .btn-secondary{
    background:none;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
  }
  .btn-secondary:hover{border-color:var(--ink-soft); color:var(--ink);}
  .hint{
    font-size:0.74rem;
    color:var(--muted);
    margin-top:8px;
    line-height:1.4;
  }
  .hint.warn{color:var(--oxblood-dark);}

  /* ---------- Preview panel ---------- */
  .panel-preview{
    background:var(--bg);
    padding:36px;
    display:flex;
    justify-content:center;
    overflow-y:auto;
  }
  .paper{
    background:var(--paper);
    width:100%;
    max-width:720px;
    min-height:960px;
    padding:70px 64px;
    box-shadow:0 1px 2px rgba(31,42,56,0.08), 0 18px 40px -12px rgba(31,42,56,0.35);
    font-family:var(--serif);
    color:#20242a;
    font-size:14px;
    line-height:1.65;
  }
  .doc-title{
    text-align:center;
    font-weight:700;
    font-size:1.2rem;
    letter-spacing:0.01em;
    margin:0 0 4px;
  }
  .doc-subtitle{
    text-align:center;
    font-style:italic;
    font-size:0.95rem;
    margin:0 0 28px;
    color:#3a3f47;
  }
  .doc-p{
    text-align:justify;
    margin:0 0 20px;
  }
  .doc-p.empty-outorgante{
    color:#a8a297;
    font-style:italic;
  }
  .doc-center{
    text-align:center;
    margin:0 0 6px;
  }
  .doc-space{height:26px;}
  .doc-sig-line{
    text-align:center;
    font-weight:700;
    margin:60px 0 4px;
  }
  .doc-footnote{
    text-align:justify;
    font-size:10px;
    line-height:1.5;
    color:#6b6558;
    font-style:italic;
    margin-top:56px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  b{font-weight:700;}

  /* Mobile tabs */
  .mobile-tabs{
    display:none;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line-strong);
  }
  .mobile-tabs button{
    flex:1;
    padding:13px;
    background:none;
    border:none;
    font-family:var(--sans);
    font-size:0.88rem;
    font-weight:600;
    color:var(--muted);
    border-bottom:3px solid transparent;
    cursor:pointer;
  }
  .mobile-tabs button.active{
    color:var(--oxblood-dark);
    border-bottom-color:var(--oxblood);
  }
  @media (max-width:920px){
    .mobile-tabs{display:flex;}
    .panel-form, .panel-preview{display:none;}
    .panel-form.show, .panel-preview.show{display:block;}
    .panel-preview.show{display:flex;}
    .panel-form{border-right:none;}
    .paper{padding:40px 26px; min-height:auto;}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Gerador de Procuração</h1>
  <span class="office">Gabriel Leme Rocha Advocacia · Macatuba/SP</span>
</div>

<div class="mobile-tabs">
  <button id="tabFormBtn" class="active">Formulário</button>
  <button id="tabPreviewBtn">Documento</button>
</div>

<div class="workspace">

  <section class="panel-form show" id="panelForm">

    <fieldset>
      <legend>Dados do outorgante</legend>

      <div class="field">
        <label for="nome">Nome completo <span class="req">*</span></label>
        <input id="nome" placeholder="nome da pessoa" autocomplete="off">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="nacionalidade">Nacionalidade</label>
          <input id="nacionalidade" list="nacionalidadeList" placeholder="nacionalidade" autocomplete="off">
          <datalist id="nacionalidadeList">
            <option value="brasileiro">
            <option value="brasileira">
          </datalist>
        </div>
        <div class="field">
          <label for="estadoCivil">Estado civil</label>
          <input id="estadoCivil" list="estadoCivilList" placeholder="estado civil" autocomplete="off">
          <datalist id="estadoCivilList">
            <option value="solteiro">
            <option value="solteira">
            <option value="casado">
            <option value="casada">
            <option value="divorciado">
            <option value="divorciada">
            <option value="viúvo">
            <option value="viúva">
            <option value="união estável">
          </datalist>
        </div>
      </div>

      <div class="field-row">
        <div class="field mono">
          <label for="rg">RG</label>
          <input id="rg" placeholder="número do rg" autocomplete="off">
        </div>
        <div class="field mono">
          <label for="cpf">CPF</label>
          <input id="cpf" placeholder="número do cpf" autocomplete="off">
        </div>
      </div>

      <div class="field-row3">
        <div class="field">
          <label for="rua">Rua / logradouro</label>
          <input id="rua" placeholder="rua" autocomplete="off">
        </div>
        <div class="field">
          <label for="numero">Número</label>
          <input id="numero" placeholder="número" autocomplete="off">
        </div>
        <div class="field mono">
          <label for="cep">CEP</label>
          <input id="cep" placeholder="número do cep" autocomplete="off">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="bairro">Bairro</label>
          <input id="bairro" placeholder="bairro" autocomplete="off">
        </div>
        <div class="field">
          <label for="cidade">Cidade</label>
          <input id="cidade" placeholder="cidade" autocomplete="off">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Local e data</legend>

      <button type="button" class="quickfill" id="quickfillDate">Preencher com Macatuba/SP e a data de hoje</button>

      <div class="field">
        <label for="local">Local</label>
        <input id="local" placeholder="Local" autocomplete="off">
      </div>
      <div class="field-row3">
        <div class="field">
          <label for="dia">Dia</label>
          <input id="dia" placeholder="dia" autocomplete="off">
        </div>
        <div class="field">
          <label for="mes">Mês</label>
          <input id="mes" placeholder="mês" autocomplete="off">
        </div>
        <div class="field">
          <label for="ano">Ano</label>
          <input id="ano" placeholder="ano" autocomplete="off">
        </div>
      </div>
    </fieldset>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="downloadBtn">Baixar PDF</button>
      <button type="button" class="btn btn-secondary" id="clearBtn">Limpar formulário</button>
      <div class="hint" id="validationHint"></div>
    </div>

  </section>

  <section class="panel-preview" id="panelPreview">
    <div class="paper" id="paper"></div>
  </section>

</div>

<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
